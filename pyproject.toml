[project]
name = "youtube-bulk-uploader"
version = "1.3.0"
description = "Bulk upload videos to YouTube as unlisted with automatic metadata extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100.0,<3",
    "google-auth-oauthlib>=1.1.0,<2",
    "google-auth-httplib2>=0.1.1,<1",
    "python-dateutil>=2.8.2,<3",
    "click>=8.1.7,<9",
    "rich>=13.7.0,<16",
    "platformdirs>=4.0.0,<5",
    "tzdata>=2025.2,<2028",
]

[project.scripts]
youtube-uploader = "youtube_bulk_uploader.main:cli"

[dependency-groups]
lint = [
    "ruff>=0.3.0,<1",
]
test = [
    "pytest>=7.4.3,<10",
    "pytest-mock>=3.12.0,<4",
]
type = [
    "mypy>=1.8.0,<3",
    "types-python-dateutil>=2.8.19",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "type" },
]

[tool.uv]
package = true
required-version = ">=0.9.18,<1.0.0"
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.9.18,<1.0.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["youtube_bulk_uploader"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
