name: Release

# Every push to the default branch that passes CI gets the next version: patch by default,
# or minor/major when the commit message contains #minor or #major. The tag is the version;
# pyproject.toml holds a placeholder, and `youtube-uploader --version` reads the tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One release at a time so two quick pushes can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only CI runs for pushes to gsanders300's own repos cut releases; copies made by others skip this.
    if: >-
      github.repository_owner == 'gsanders300' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0  # full history so existing version tags are visible
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            if [[ "$MESSAGE" == *"#major"* ]]; then
              next="v$((major + 1)).0.0"
            elif [[ "$MESSAGE" == *"#minor"* ]]; then
              next="v${major}.$((minor + 1)).0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          gh release create "$next" --target "$SHA" --title "$next" --notes "$MESSAGE"
