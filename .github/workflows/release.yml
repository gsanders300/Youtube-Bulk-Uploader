name: Release

# Every push to the default branch gets the next version: patch by default, or minor/major
# when the commit message contains #minor or #major.
on:
  push:
    branches: ['**']

# One release at a time per branch so two quick pushes can't claim the same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only the default branch of gsanders300's own repos cuts releases; copies made by others skip this.
    if: github.repository_owner == 'gsanders300' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so existing version tags are visible
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            if [[ "$MESSAGE" == *"#major"* ]]; then
              next="v$((major + 1)).0.0"
            elif [[ "$MESSAGE" == *"#minor"* ]]; then
              next="v${major}.$((minor + 1)).0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi
          gh release create "$next" --target "$GITHUB_SHA" --title "$next" --notes "$MESSAGE"
